---
- name: Deploy BankOps core services
  hosts: local
  connection: local
  gather_facts: false

  vars:
    project_root: "{{ playbook_dir }}/../.."

  roles:
    - role: prerequisites
      tags:
        - prerequisites
        - deploy

    - role: mysql
      tags:
        - mysql
        - deploy

    - role: customer_service
      tags:
        - customer_service
        - deploy

    - role: verification
      tags:
        - verification
        - deploy
