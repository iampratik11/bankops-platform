
name: BankOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: bankops-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  ci:
    name: Test, scan and publish
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Ansible playbook syntax
        run: |
          ansible-playbook ansible/playbooks/deploy-core.yml --syntax-check
          ansible-playbook ansible/playbooks/verify-core.yml --syntax-check

      - name: Verify encrypted Vault file
        run: |
          test -f k8s/base/mysql/secret.yaml.vault
          head -n 1 k8s/base/mysql/secret.yaml.vault |
            grep -q '^\$ANSIBLE_VAULT;'

      - name: Build and test
        run: |
          mvn -B -ntp \
            -pl services/customer-service,services/account-service \
            -am clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bankops-test-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: latest

      - name: Scan repository for secrets
        run: |
          trivy fs \
            --scanners secret \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            .

      - name: Scan Containerfiles
        run: |
          set -euo pipefail
          for service in customer-service account-service; do
            trivy config \
              --exit-code 1 \
              --severity HIGH,CRITICAL \
              "services/${service}/Containerfile"
          done

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          IMAGE_PREFIX="$(echo "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')"
          for service in customer-service account-service; do
            docker build \
              -f "services/${service}/Containerfile" \
              -t "${IMAGE_PREFIX}/${service}:sha-${GITHUB_SHA}" \
              .
          done

      - name: Scan images
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          IMAGE_PREFIX="$(echo "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')"
          for service in customer-service account-service; do
            trivy image \
              --exit-code 1 \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              "${IMAGE_PREFIX}/${service}:sha-${GITHUB_SHA}"
          done

      - name: Push images
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          IMAGE_PREFIX="$(echo "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')"
          for service in customer-service account-service; do
            docker push "${IMAGE_PREFIX}/${service}:sha-${GITHUB_SHA}"
          done

  deploy:
    name: Deploy to Kubernetes with Ansible
    needs: ci
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64]
    environment: bankops-lab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Ansible is available
        run: |
          ansible --version
          ansible-playbook --version
          kubectl config current-context

      - name: Deploy application with Ansible
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          IMAGE_TAG: sha-${{ github.sha }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          set -euo pipefail
          IMAGE_PREFIX="$(echo "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')"

          vault_file="$(mktemp)"
          chmod 600 "$vault_file"
          trap 'rm -f "$vault_file"' EXIT

          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > "$vault_file"
          unset ANSIBLE_VAULT_PASSWORD

          # Replace this path with your application deployment playbook.
          # The playbook/templates must consume IMAGE_PREFIX and IMAGE_TAG.
          ansible-playbook ansible/playbooks/deploy-apps.yml \
            --vault-password-file "$vault_file" \
            -e "image_prefix=${IMAGE_PREFIX}" \
            -e "image_tag=${IMAGE_TAG}"

      - name: Verify application rollout
        run: |
          kubectl rollout status deployment/customer-service --timeout=180s
          kubectl rollout status deployment/account-service --timeout=180s
          kubectl get deployments,pods

